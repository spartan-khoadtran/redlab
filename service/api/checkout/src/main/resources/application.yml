micronaut:
  application:
    name: api
  server:
    port: ${PORT:8000}
  netty:
    event-loops:
      default:
        # One event loop thread on purpose: the single-threaded runtime the CPU exercise saturates.
        num-threads: 1

jackson:
  property-naming-strategy: SNAKE_CASE

# OpenTelemetry autoconfigure keys. The sampler follows the parent, so loadgen's root decision wins.
otel:
  service:
    name: ${SERVICE_NAME:api}
  exporter:
    otlp:
      endpoint: ${OTLP_ENDPOINT:`http://tempo:4318`}
      protocol: http/protobuf
  traces:
    exporter: otlp
    sampler: parentbased_traceidratio
    sampler.arg: ${TRACE_SAMPLE_RATIO:1.0}
  metrics:
    exporter: none
  logs:
    exporter: none
  # Not traced: the scrape, the controller's fault pushes and Envoy's health checks would drown the real requests.
  exclusions:
    - /health
    - /metrics
    - /admin/.*

app:
  service:
    name: ${SERVICE_NAME:api}
  database:
    url: ${DB_URL:`jdbc:postgresql://postgres:5432/lab`}
    username: ${DB_USERNAME:lab}
    password: ${DB_PASSWORD:lab}
    # The real pool. The pool the exercises resize is the gate in front of it (pool_max, default 4).
    pool-max: 24
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:`kafka:9092`}
    topic: ${KAFKA_TOPIC:orders}
  checkout:
    pricing-url: ${PRICING_URL:`http://pricing:8001`}
    redis-host: ${REDIS_HOST:redis}
